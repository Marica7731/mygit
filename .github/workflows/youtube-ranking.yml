name: Update YouTube ranking

on:
  push:
    branches:
      - main
      - codex/ytb-ranking-pages
    paths:
      - ".github/workflows/youtube-ranking.yml"
      - "scripts/update-youtube-ranking.js"
      - "assets/**"
      - "*.html"
      - "package.json"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-ranking-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YTB_RANKING_LIVE_LIMIT: "500"
      YTB_RANKING_TODAY_LIMIT: "500"
      YTB_RANKING_MONTH_LIMIT: "500"
      YTB_RANKING_SCROLL_TO_BOTTOM_GROUPS: "live,today"
      YTB_RANKING_ENRICH_LIVE_DETAILS: "1"
      YTB_RANKING_LIVE_DETAIL_LIMIT: "120"
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Update ranking data
        run: node scripts/update-youtube-ranking.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-ranking.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: 更新 YouTube 排行数据"
            git fetch origin main
            git rebase origin/main
            git push || {
              git fetch origin main
              git rebase origin/main
              git push
            }
          fi
