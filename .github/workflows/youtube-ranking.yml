
          node scripts/validate-live-snapshots.js
          node scripts/write-ranking-groups.js
          node scripts/write-ranking-groups.js --check

      - name: Run release gates
        run: |
          set +e
          npm run verify 2>&1 | tee /tmp/release-gate.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Release gate failed with exit code $status"
            {
              echo "### Release gate failure"
              echo
              echo '```text'
              tail -n 120 /tmp/release-gate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 /tmp/release-gate.log | sed 's/^/::error:: /'
            diagnostics=$(tail -n 80 /tmp/release-gate.log | tr '\n' '|' | cut -c1-12000)
            echo "::error::RELEASE_GATE_LOG ${diagnostics}"
            exit "$status"
          fi

      - name: Commit updated data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/youtube-ranking.json /tmp/youtube-ranking.json
          node scripts/update-ranking-status.js
          cp data/youtube-ranking-status.json /tmp/youtube-ranking-status.json
          cp data/ranking-union-cache.json /tmp/ranking-union-cache.json
          publish_attempt() {
            set -e
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/youtube-ranking.json data/youtube-ranking.json
            cp /tmp/youtube-ranking-status.json data/youtube-ranking-status.json
            cp /tmp/ranking-union-cache.json data/ranking-union-cache.json
            npm run blocklist:generate
            YTB_RANKING_SNAPSHOT_GROUPS=live,today node scripts/archive-live-snapshot.js
            YTB_RANKING_SNAPSHOT_SPARSE=1 node scripts/validate-live-snapshots.js
            node scripts/write-ranking-groups.js
            node scripts/write-ranking-groups.js --check
            git add assets/blocked-vtuber-channels.js index.html live.html today.html week.html month.html data/youtube-ranking.json data/youtube-ranking-live.json data/youtube-ranking-today.json data/youtube-ranking-month.json data/youtube-ranking-week.json data/youtube-ranking-status.json data/ranking-union-cache.json data/live-snapshots data/today-snapshots data/week-snapshots data/month-snapshots
            git add -f data/live-snapshots/*.json data/today-snapshots/*.json data/week-snapshots/*.json data/month-snapshots/*.json
            if git diff --cached --quiet; then
              echo "No data changes to commit."
              return 0
            fi
            git commit -m "chore: 更新 YouTube 排行数据和状态"
            git push
          }

          for attempt in 1 2 3; do
            if (publish_attempt); then
              exit 0
            fi
            echo "Publish attempt $attempt/3 failed; retrying in 5 seconds."
            sleep 5
          done
          echo "::error::Failed to publish ranking data after 3 attempts."
          exit 1

