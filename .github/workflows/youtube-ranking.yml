name: Update YouTube ranking

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/youtube-ranking.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-ranking-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YTB_RANKING_LIVE_LIMIT: "500"
      YTB_RANKING_TODAY_LIMIT: "500"
      YTB_RANKING_MONTH_LIMIT: "500"
      YTB_RANKING_SCROLL_TO_BOTTOM_GROUPS: "live,today"
      YTB_RANKING_ENRICH_LIVE_DETAILS: "0"
      YTB_RANKING_LIVE_DETAIL_LIMIT: "5"
      YTB_RANKING_LIVE_DETAIL_DELAY_MS: "500"
      YTB_RANKING_LIVE_DETAIL_NAVIGATION_TIMEOUT_MS: "15000"
      YTB_RANKING_METRIC_DETAIL_LIMIT: "120"
      YTB_RANKING_METRIC_DETAIL_DELAY_MS: "900"
      YTB_RANKING_METRIC_DETAIL_NAVIGATION_TIMEOUT_MS: "20000"
      YTB_RANKING_LIVE_POST_DETAIL_LIMIT: "120"
      YTB_RANKING_LIVE_POST_CHANNEL_LIMIT: "120"
      YTB_RANKING_LIVE_POST_DELAY_MS: "550"
      YTB_RANKING_LIVE_POST_NAVIGATION_TIMEOUT_MS: "12000"
      YTB_RANKING_DURATION_DETAIL_LIMIT: "500"
      YTB_RANKING_LIVE_DURATION_DETAIL_LIMIT: "120"
      YTB_RANKING_DURATION_FETCH_CONCURRENCY: "4"
      YTB_RANKING_DURATION_FETCH_TIMEOUT_MS: "10000"
      YTB_RANKING_MIN_VIEW_COVERAGE: "0.8"
      YTB_RANKING_MIN_KEYWORD_VIEW_COVERAGE: "0.75"
      YTB_RANKING_MIN_DURATION_COVERAGE: "0.85"
      YTB_RANKING_MIN_KEYWORD_DURATION_COVERAGE: "0.8"
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Update ranking data
        run: node scripts/update-youtube-ranking.js

      - name: Enrich live channel metrics
        run: node scripts/enrich-live-details.js

      - name: Enrich video view metrics
        run: node scripts/enrich-video-metrics.js

      - name: Fill missing durations
        run: node scripts/fill-duration-details.js

      - name: Validate ranking data
        run: node scripts/validate-youtube-ranking.js

      - name: Validate duration data
        run: node scripts/validate-duration-quality.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/youtube-ranking.json /tmp/youtube-ranking.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/youtube-ranking.json data/youtube-ranking.json
          git add data/youtube-ranking.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: 更新 YouTube 排行数据"
            git push || {
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/youtube-ranking.json data/youtube-ranking.json
              git add data/youtube-ranking.json
              git diff --cached --quiet && exit 0
              git commit -m "chore: 更新 YouTube 排行数据"
              git push
            }
          fi
