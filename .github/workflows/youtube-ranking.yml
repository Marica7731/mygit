name: Update YouTube ranking

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/youtube-ranking.yml"
      - "scripts/update-youtube-ranking.js"
      - "scripts/enrich-live-details.js"
      - "scripts/enrich-video-metrics.js"
      - "scripts/merge-previous-view-metrics.js"
      - "scripts/fill-duration-details.js"
      - "scripts/clear-live-duration-fields.js"
      - "scripts/fill-live-elapsed-duration.js"
      - "scripts/fill-live-innertube-duration.js"
      - "scripts/fill-live-relative-duration.js"
      - "scripts/normalize-duration-fields.js"
      - "scripts/validate-youtube-ranking.js"
      - "scripts/validate-duration-quality.js"
      - "scripts/archive-live-snapshot.js"
      - "scripts/validate-live-snapshots.js"
      - "scripts/write-ranking-groups.js"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: youtube-ranking-main
  cancel-in-progress: false

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YTB_RANKING_LIVE_LIMIT: "500"
      YTB_RANKING_TODAY_LIMIT: "500"
      YTB_RANKING_MONTH_LIMIT: "500"
      YTB_RANKING_SCROLL_TO_BOTTOM_GROUPS: "live,today"
      YTB_RANKING_ENRICH_LIVE_DETAILS: "0"
      YTB_RANKING_LIVE_DETAIL_LIMIT: "5"
      YTB_RANKING_LIVE_DETAIL_DELAY_MS: "500"
      YTB_RANKING_LIVE_DETAIL_NAVIGATION_TIMEOUT_MS: "15000"
      YTB_RANKING_METRIC_DETAIL_LIMIT: "120"
      YTB_RANKING_METRIC_FETCH_LIMIT: "240"
      YTB_RANKING_METRIC_FETCH_CONCURRENCY: "8"
      YTB_RANKING_METRIC_FETCH_TIMEOUT_MS: "6000"
      YTB_RANKING_OEMBED_CHANNEL_LIMIT: "1000"
      YTB_RANKING_OEMBED_CHANNEL_CONCURRENCY: "8"
      YTB_RANKING_OEMBED_CHANNEL_TIMEOUT_MS: "6000"
      YTB_RANKING_METRIC_DETAIL_DELAY_MS: "900"
      YTB_RANKING_METRIC_DETAIL_NAVIGATION_TIMEOUT_MS: "20000"
      YTB_RANKING_LIVE_POST_DETAIL_LIMIT: "120"
      YTB_RANKING_LIVE_POST_CHANNEL_LIMIT: "120"
      YTB_RANKING_LIVE_POST_DELAY_MS: "550"
      YTB_RANKING_LIVE_POST_NAVIGATION_TIMEOUT_MS: "12000"
      YTB_RANKING_LIVE_POST_MAX_RUNTIME_MS: "420000"
      YTB_RANKING_DURATION_DETAIL_LIMIT: "500"
      YTB_RANKING_DURATION_API_LIMIT: "1600"
      YTB_RANKING_LIVE_DURATION_DETAIL_LIMIT: "120"
      YTB_RANKING_DURATION_FETCH_CONCURRENCY: "4"
      YTB_RANKING_DURATION_FETCH_TIMEOUT_MS: "10000"
      YTB_RANKING_DURATION_PLAYWRIGHT_LIMIT: "160"
      YTB_RANKING_DURATION_PLAYWRIGHT_DELAY_MS: "600"
      YTB_RANKING_DURATION_PLAYWRIGHT_NAVIGATION_TIMEOUT_MS: "15000"
      YTB_RANKING_DURATION_INCLUDE_LIVE: "0"
      YTB_RANKING_LIVE_ELAPSED_LIMIT: "120"
      YTB_RANKING_LIVE_ELAPSED_DELAY_MS: "300"
      YTB_RANKING_LIVE_ELAPSED_NAVIGATION_TIMEOUT_MS: "10000"
      YTB_RANKING_LIVE_INNERTUBE_LIMIT: "120"
      YTB_RANKING_LIVE_INNERTUBE_CONCURRENCY: "4"
      YTB_RANKING_LIVE_INNERTUBE_TIMEOUT_MS: "8000"
      YTB_RANKING_LIVE_RELATIVE_DURATION_LIMIT: "120"
      YTB_RANKING_LIVE_RELATIVE_DURATION_DELAY_MS: "2500"
      YTB_RANKING_LIVE_RELATIVE_DURATION_NAVIGATION_TIMEOUT_MS: "15000"
      YTB_RANKING_LIVE_RELATIVE_DURATION_SIGNAL_TIMEOUT_MS: "8000"
      YTB_RANKING_MIN_VIEW_COVERAGE: "0.8"
      YTB_RANKING_MIN_KEYWORD_VIEW_COVERAGE: "0.75"
      YTB_RANKING_MIN_LIVE_ITEMS: "20"
      YTB_RANKING_MIN_TODAY_VIDEOS: "240"
      YTB_RANKING_MIN_MONTH_VIDEOS: "300"
      YTB_RANKING_MIN_LIVE_SUBSCRIBER_COVERAGE: "0.85"
      YTB_RANKING_MIN_DURATION_COVERAGE: "0.95"
      YTB_RANKING_MIN_KEYWORD_DURATION_COVERAGE: "0.95"
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Snapshot previous ranking data
        run: |
          git fetch origin main
          git show origin/main:data/youtube-ranking.json > /tmp/youtube-ranking-previous.json || true

      - name: Update ranking data
        run: node scripts/update-youtube-ranking.js

      - name: Check initial view signal
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('data/youtube-ranking.json', 'utf8'));
          const warnings = [];
          const hasViewSignal = (item) => Number(item.viewCount) > 0 || /[0-9０-９][0-9０-９,，.．]*\s*(?:億|亿|万|萬|千|K|M|B)?\s*(?:回視聴|視聴回数|views?|次观看|次觀看|播放)/i.test(String(item.viewText || ''));
          for (const group of ['today', 'month']) {
            const videos = (payload.groups?.[group]?.items || []).filter((item) => item.statusType !== 'live' && item.statusType !== 'upcoming');
            if (videos.length < 30) continue;
            const withViews = videos.filter(hasViewSignal).length;
            const ratio = withViews / videos.length;
            console.log(`[initial-view] ${group}: ${withViews}/${videos.length} (${Math.round(ratio * 1000) / 10}%)`);
            if (ratio < 0.1) warnings.push(`${group}: initial view signal ${withViews}/${videos.length} below 10%`);
          }
          if (warnings.length) {
            console.warn('[initial-view] low initial view signal; continuing to detail enrichment and final validation.');
            for (const warning of warnings) console.warn(`- ${warning}`);
          }
          NODE

      - name: Enrich live channel metrics
        timeout-minutes: 10
        continue-on-error: true
        run: node scripts/enrich-live-details.js

      - name: Enrich video view metrics
        timeout-minutes: 18
        run: node scripts/enrich-video-metrics.js

      - name: Recover previous view metrics
        run: node scripts/merge-previous-view-metrics.js

      - name: Fill missing durations
        timeout-minutes: 20
        run: node scripts/fill-duration-details.js

      - name: Skip live duration enrichment
        run: echo "Live page hides duration by design; skip live elapsed and Innertube duration enrichment."

      - name: Normalize duration fields
        run: node scripts/normalize-duration-fields.js

      - name: Clear live duration fields
        run: node scripts/clear-live-duration-fields.js

      - name: Validate ranking data
        id: validate_ranking
        continue-on-error: true
        run: node scripts/validate-youtube-ranking.js

      - name: Retry ranking data with conservative settings
        if: steps.validate_ranking.outcome == 'failure'
        env:
          YTB_RANKING_SCROLL_TO_BOTTOM_GROUPS: "live,today,month"
          YTB_RANKING_MAX_SCROLLS: "220"
          YTB_RANKING_SCROLL_DELAY_MS: "2000"
          YTB_RANKING_INITIAL_DELAY_MS: "4000"
          YTB_RANKING_NAVIGATION_TIMEOUT_MS: "90000"
          YTB_RANKING_METRIC_FETCH_CONCURRENCY: "4"
          YTB_RANKING_METRIC_FETCH_TIMEOUT_MS: "10000"
          YTB_RANKING_OEMBED_CHANNEL_CONCURRENCY: "4"
          YTB_RANKING_OEMBED_CHANNEL_TIMEOUT_MS: "10000"
          YTB_RANKING_DURATION_FETCH_CONCURRENCY: "2"
          YTB_RANKING_DURATION_FETCH_TIMEOUT_MS: "12000"
        run: |
          echo "::warning::Initial ranking validation failed. Retrying once with conservative scroll and fetch settings."
          node scripts/update-youtube-ranking.js
          node scripts/enrich-live-details.js
          node scripts/enrich-video-metrics.js
          node scripts/merge-previous-view-metrics.js
          node scripts/fill-duration-details.js
          echo "Live page hides duration by design; skip live elapsed and Innertube duration enrichment."
          node scripts/normalize-duration-fields.js
          node scripts/clear-live-duration-fields.js

      - name: Validate ranking data after retry
        run: node scripts/validate-youtube-ranking.js

      - name: Validate duration data
        run: node scripts/validate-duration-quality.js

      - name: Archive ranking snapshots
        run: |
          node scripts/archive-live-snapshot.js
          node scripts/validate-live-snapshots.js
          node scripts/write-ranking-groups.js
          node scripts/write-ranking-groups.js --check

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/youtube-ranking.json /tmp/youtube-ranking.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp /tmp/youtube-ranking.json data/youtube-ranking.json
          node scripts/archive-live-snapshot.js
          node scripts/validate-live-snapshots.js
          node scripts/write-ranking-groups.js
          node scripts/write-ranking-groups.js --check
          git add data/youtube-ranking.json data/youtube-ranking-live.json data/youtube-ranking-today.json data/youtube-ranking-month.json data/live-snapshots data/today-snapshots data/month-snapshots
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: 更新 YouTube 排行数据"
            git push || {
              git fetch origin main
              git reset --hard origin/main
              mkdir -p data
              cp /tmp/youtube-ranking.json data/youtube-ranking.json
              node scripts/archive-live-snapshot.js
              node scripts/validate-live-snapshots.js
              node scripts/write-ranking-groups.js
              node scripts/write-ranking-groups.js --check
              git add data/youtube-ranking.json data/youtube-ranking-live.json data/youtube-ranking-today.json data/youtube-ranking-month.json data/live-snapshots data/today-snapshots data/month-snapshots
              git diff --cached --quiet && exit 0
              git commit -m "chore: 更新 YouTube 排行数据"
              git push
            }
          fi
      - name: Mark failed run
        if: failure()
        run: echo "previous ranking step" > /tmp/youtube-ranking-run-failed

      - name: Update run status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          force_failure=""
          if [ -f /tmp/youtube-ranking-run-failed ]; then
            force_failure="previous ranking step"
            git fetch origin main
            git show origin/main:data/youtube-ranking.json > data/youtube-ranking.json || true
          fi
          YTB_RANKING_FORCE_FAILURE="$force_failure" node scripts/update-ranking-status.js
          cp data/youtube-ranking-status.json /tmp/youtube-ranking-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp /tmp/youtube-ranking-status.json data/youtube-ranking-status.json
          git add data/youtube-ranking-status.json
          if git diff --cached --quiet; then
            echo "No status changes to commit."
          else
            git commit -m "chore: 更新 YouTube 抓取状态"
            git push || {
              git fetch origin main
              git reset --hard origin/main
              mkdir -p data
              cp /tmp/youtube-ranking-status.json data/youtube-ranking-status.json
              git add data/youtube-ranking-status.json
              git diff --cached --quiet && exit 0
              git commit -m "chore: 更新 YouTube 抓取状态"
              git push
            }
          fi

      - name: Dispatch next chain tick
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run youtube-ranking-chain.yml --ref main --repo "$GITHUB_REPOSITORY" -f trigger_run_id="$GITHUB_RUN_ID" || {
            echo "::warning::Failed to dispatch chain workflow; scheduler fallback remains active."
          }
