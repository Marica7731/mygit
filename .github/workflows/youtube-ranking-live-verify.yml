name: Verify live YouTube ranking deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-ranking-live-verify.yml"
      - "data/youtube-ranking.json"
      - "data/youtube-ranking-status.json"
      - "data/youtube-ranking-week.json"
      - "week.html"
      - "month.html"
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: youtube-ranking-live-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TARGET_DEPLOY_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      RANKING_SITE_ORIGIN: https://ytb.culua.com
    steps:
      - name: Verify Pages deployment and live HTTP/JSON evidence
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const repo = process.env.GITHUB_REPOSITORY;
          const targetSha = process.env.TARGET_DEPLOY_SHA;
          const specificRunId = process.env.TARGET_DEPLOY_RUN_ID;
          const origin = process.env.RANKING_SITE_ORIGIN;
          const deadline = Date.now() + 19 * 60 * 1000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          function pagesRun() {
            if (specificRunId) {
              try {
                return JSON.parse(execFileSync(
                  'gh',
                  ['api', '--method', 'GET', `repos/${repo}/actions/runs/${specificRunId}`],
                  { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] },
                ));
              } catch {
                return null;
              }
            }
            const json = JSON.parse(execFileSync(
              'gh',
              ['api', '--method', 'GET', `repos/${repo}/actions/runs`, '-f', `head_sha=${targetSha}`, '-f', 'per_page=20'],
              { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] },
            ));
            return (json.workflow_runs || []).find((run) => run.name === 'pages build and deployment') || null;
          }

          async function main() {
            let deployed;
            while (Date.now() < deadline) {
              deployed = pagesRun();
              if (deployed?.status === 'completed') break;
              console.log(`[online] waiting for Pages run at SHA ${targetSha}: ${deployed?.status || 'not found'}`);
              await sleep(20000);
            }
            if (!deployed || deployed.status !== 'completed' || deployed.conclusion !== 'success') {
              throw new Error(`Pages deployment not successful: ${JSON.stringify({
                id: deployed?.id, sha: deployed?.head_sha, status: deployed?.status, conclusion: deployed?.conclusion
              })}`);
            }
            console.log('[online] Pages deployment ' + JSON.stringify({
              runId: deployed.id, sha: deployed.head_sha, conclusion: deployed.conclusion,
              completedAt: deployed.updated_at, url: deployed.html_url
            }));

            const paths = [
              '/today.html', '/month.html', '/week.html',
              '/data/youtube-ranking.json', '/data/youtube-ranking-status.json',
              '/data/youtube-ranking-week.json', '/data/month-snapshots/index.json',
            ];
            let checked;
            for (let attempt = 1; attempt <= 6; attempt++) {
              checked = await Promise.all(paths.map(async (pathname) => {
                const url = origin + pathname + '?verify=' + process.env.GITHUB_RUN_ID + '-' + attempt;
                const response = await fetch(url, { signal: AbortSignal.timeout(20000), cache: 'no-store' });
                const body = await response.text();
                return { pathname, status: response.status, contentType: response.headers.get('content-type'),
                  body, bytes: Buffer.byteLength(body) };
              }));
              if (checked.every((x) => x.status === 200)) break;
              await sleep(15000);
            }
            const info = checked.map(({pathname, status, contentType, bytes}) => ({pathname, status, contentType, bytes}));
            console.log('[online] HTTP evidence ' + JSON.stringify(info));
            if (checked.some((x) => x.status !== 200)) throw new Error('Live page or JSON HTTP status is not 200');

            const bodyByPath = Object.fromEntries(checked.map((entry) => [entry.pathname, entry.body]));
            const html = bodyByPath['/today.html'];
            const monthHtml = bodyByPath['/month.html'];
            const weekHtml = bodyByPath['/week.html'];
            const ranking = JSON.parse(bodyByPath['/data/youtube-ranking.json']);
            const status = JSON.parse(bodyByPath['/data/youtube-ranking-status.json']);
            const weekData = JSON.parse(bodyByPath['/data/youtube-ranking-week.json']);
            const monthSnapshotIndex = JSON.parse(bodyByPath['/data/month-snapshots/index.json']);
            const today = ranking.groups?.today?.items || [];
            const validViews = today.filter((item) =>
              item.statusType !== 'live' && item.statusType !== 'upcoming' && Number(item.viewCount) > 0).length;
            const evidence = {
              deployedSha: deployed.head_sha, generatedAt: ranking.generatedAt,
              todayCount: today.length, todayWithViews: validViews,
              status: status.status, attemptedAt: status.attemptedAt,
              lastSuccessfulGeneratedAt: status.lastSuccessfulGeneratedAt,
              lastUpdateRunId: status.runId, failureMessage: status.message,
              htmlHasTodayGroup: /data-source-group="today"/.test(html),
              htmlHasAppRoot: /id="app"/.test(html)
            };
            console.log('[online] RANKING EVIDENCE ' + JSON.stringify(evidence));
            if (!evidence.htmlHasTodayGroup || !evidence.htmlHasAppRoot) throw new Error('Live today.html markers missing');
            if (!Number.isFinite(Date.parse(ranking.generatedAt))) throw new Error('Missing valid ranking generatedAt');
            if (Date.parse(ranking.generatedAt) <= Date.parse('2026-09-25T15:47:44.067Z'))
              throw new Error('Ranking generatedAt has not advanced from the stale production snapshot');
            if (status.status !== 'success') throw new Error('Online ranking status is not success');
            if (today.length >= 240 && validViews < 240)
              throw new Error(`Online viewCount quality insufficient: ${validViews}/${today.length}`);

            const windows = ranking.rankingWindows || {};
            const monthItems = ranking.groups?.month?.items || [];
            const weekItems = weekData.groups?.week?.items || [];
            const monthStart = Date.parse(windows.month?.start || '');
            const monthEnd = Date.parse(windows.month?.end || '');
            const weekStart = Date.parse(windows.week?.start || '');
            const weekEnd = Date.parse(windows.week?.end || '');
            const monthStartDay = Number.isFinite(monthStart) && windows.month?.timeZone
              ? new Intl.DateTimeFormat('en-CA', { timeZone: windows.month.timeZone, day: '2-digit' }).format(new Date(monthStart))
              : '';
            const countOutside = (items, start, end) => items.filter((item) => {
              const timestamp = Number(item.publishedTimestamp);
              return !Number.isFinite(timestamp) || timestamp < start || timestamp > end;
            }).length;
            const windowEvidence = {
              monthKind: windows.month?.kind,
              monthStart: windows.month?.start,
              monthStartDay,
              monthSourceItems: windows.sourceItemCount,
              monthItems: monthItems.length,
              monthItemsOutsideWindow: countOutside(monthItems, monthStart, monthEnd),
              weekKind: windows.week?.kind,
              weekStart: windows.week?.start,
              weekDurationMs: windows.week?.durationMs,
              weekItems: weekItems.length,
              weekItemsOutsideWindow: countOutside(weekItems, weekStart, weekEnd),
              htmlHasMonthGroup: /data-source-group="month"/.test(monthHtml),
              htmlHasWeekGroup: /data-source-group="week"/.test(weekHtml),
              monthSnapshotPolicy: monthSnapshotIndex.retentionPolicy,
              monthSnapshotCount: (monthSnapshotIndex.snapshots || []).length,
              monthSnapshotRetentionPending: monthSnapshotIndex.retentionPolicy == null,
            };
            console.log('[online] WINDOW EVIDENCE ' + JSON.stringify(windowEvidence));
            if (!windowEvidence.htmlHasMonthGroup || !windowEvidence.htmlHasWeekGroup)
              throw new Error('Live month.html or week.html group marker missing');
            if (windowEvidence.monthKind !== 'calendar-month' || windowEvidence.monthStartDay !== '01')
              throw new Error(`Live month window is not a calendar month: ${JSON.stringify(windowEvidence)}`);
            if (windowEvidence.monthItemsOutsideWindow !== 0)
              throw new Error(`Live month items outside the calendar-month window: ${JSON.stringify(windowEvidence)}`);
            if (!(Number(windowEvidence.monthSourceItems) > 0))
              throw new Error(`Live month crawl pool is empty: ${JSON.stringify(windowEvidence)}`);
            if (windowEvidence.weekKind !== 'rolling' || Number(windowEvidence.weekDurationMs) !== 7 * 24 * 60 * 60 * 1000)
              throw new Error(`Live week window is not a rolling 168h window: ${JSON.stringify(windowEvidence)}`);
            if (windowEvidence.weekItemsOutsideWindow !== 0)
              throw new Error(`Live week items outside the 7-day window: ${JSON.stringify(windowEvidence)}`);
            // The first deployment after this migration may still carry the old
            // schema-1 index until youtube-ranking.yml archives with keep-all.
            // Accept only that missing-policy transition; once present, enforce it.
            const retentionReady = windowEvidence.monthSnapshotPolicy === 'keep-all';
            const retentionPending = windowEvidence.monthSnapshotRetentionPending;
            if ((!retentionReady && !retentionPending) || windowEvidence.monthSnapshotCount < 1)
              throw new Error(`Live snapshot history is not keep-all: ${JSON.stringify(windowEvidence)}`);
            if (retentionPending)
              console.warn('[online] snapshot retention migration pending; will enforce keep-all after the next archive');
          }
          main().catch((error) => { console.error('[online] VERIFICATION FAILED: ' + error.message); process.exitCode = 1; });
          NODE
