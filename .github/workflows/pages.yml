name: Deploy YouTube ranking Pages
run-name: ${{ inputs.recovery && 'Recover YouTube ranking Pages' || 'Deploy YouTube ranking Pages' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      recovery:
        description: Marks a retry so a failed retry waits for the next scheduled check
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: youtube-ranking-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_deploy: ${{ steps.freshness.outputs.should_deploy }}
    steps:
      - name: Checkout publish files only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /assets/
            /config/
            /docs/
            /.github/
            /data/*.json
            /data/*-snapshots/index.json
            /README.md
            /package.json
            /package-lock.json
            /CNAME
            /index.html
            /month.html
            /today.html
            /live.html
            /week.html
            /favicon.ico
            /.gitignore
            /.nojekyll
          sparse-checkout-cone-mode: false

      - name: Check Pages commit matches main
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$GITHUB_SHA" == "$latest_sha" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale Pages commit $GITHUB_SHA; main now points to $latest_sha."
          fi

      - name: Validate bounded publish tree
        if: steps.freshness.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          for path in \
            index.html month.html today.html week.html live.html \
            data/youtube-ranking.json data/youtube-ranking-week.json \
            data/youtube-ranking-today.json data/youtube-ranking-status.json \
            data/ranking-union-cache.json \
            data/month-snapshots/index.json \
            data/week-snapshots/index.json \
            data/today-snapshots/index.json \
            data/live-snapshots/index.json
          do
            test -f "$path"
          done
          payload_count="$(
            find data \
              \( -path 'data/month-snapshots/*.json' \
                 -o -path 'data/week-snapshots/*.json' \
                 -o -path 'data/today-snapshots/*.json' \
                 -o -path 'data/live-snapshots/*.json' \) \
              ! -name index.json \
              -type f | wc -l | tr -d ' '
          )"
          if [ "$payload_count" -ne 0 ]; then
            echo "::error::Pages publish tree contains $payload_count historical snapshot payloads; sparse checkout must exclude them."
            exit 1
          fi
          printf 'Publish tree validated; historical snapshot payloads=%s.\n' "$payload_count"

      - name: Build compact today ranking and history index
        if: steps.freshness.outputs.should_deploy == 'true'
        run: node scripts/build-today-view.js

      - name: Build compact snapshot options
        if: steps.freshness.outputs.should_deploy == 'true'
        run: node scripts/build-snapshot-options.js

      - name: Configure GitHub Pages
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload bounded Pages artifact
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          retention-days: 1

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages commit is still current
        id: publish_freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$GITHUB_SHA" == "$latest_sha" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale Pages commit $GITHUB_SHA; main now points to $latest_sha."
          fi

      - name: Deploy to GitHub Pages
        if: steps.publish_freshness.outputs.should_deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Dispatch live verification
        if: steps.publish_freshness.outputs.should_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            echo "Dispatching live verification (attempt $attempt/3)."
            if gh workflow run youtube-ranking-live-verify.yml --ref main --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Live verification dispatch attempt $attempt failed; retrying in 10 seconds."
              sleep 10
            fi
          done
          echo "::error::Failed to dispatch live verification after 3 attempts."
          exit 1
