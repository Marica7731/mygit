name: Chain YouTube ranking update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/youtube-ranking-chain.yml"
  schedule:
    - cron: "6,16,26,36,46,56 * * * *"
  workflow_dispatch:
    inputs:
      trigger_run_id:
        description: "Update run id that requested this tick"
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: youtube-ranking-chain
  cancel-in-progress: false

jobs:
  dispatch-next:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YTB_RANKING_CHAIN_TARGET_INTERVAL_SECONDS: "600"
      YTB_RANKING_CHAIN_FALLBACK_DELAY_SECONDS: "0"
      YTB_RANKING_FAILURE_COOLDOWN_MINUTES: "30"
      YTB_RANKING_FAILURE_COOLDOWN_BUFFER_SECONDS: "30"
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.trigger_run_id || '' }}
    steps:
      - name: Dispatch update when idle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');

          const repo = process.env.GITHUB_REPOSITORY;
          const triggerRunId = String(process.env.TRIGGER_RUN_ID || '');
          const eventName = process.env.GITHUB_EVENT_NAME || '';
          const isManualDispatch = eventName === 'workflow_dispatch' && !triggerRunId;
          const targetIntervalMs = Number(process.env.YTB_RANKING_CHAIN_TARGET_INTERVAL_SECONDS || 600) * 1000;
          const fallbackDelayMs = Number(process.env.YTB_RANKING_CHAIN_FALLBACK_DELAY_SECONDS || 0) * 1000;
          const cooldownMinutes = Number(process.env.YTB_RANKING_FAILURE_COOLDOWN_MINUTES || 30);
          const cooldownBufferMs = Number(process.env.YTB_RANKING_FAILURE_COOLDOWN_BUFFER_SECONDS || 30) * 1000;

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });

          async function main() {
            await waitBeforeIdleCheck();
            await dispatchWhenIdle({ allowCooldownWait: Boolean(triggerRunId) && !isManualDispatch });
          }

          async function waitBeforeIdleCheck() {
            const delayMs = triggerRunId ? triggerDelayMs() : fallbackDelayMs;
            if (delayMs <= 0) {
              console.log('No chain delay needed before idle check.');
              return;
            }

            console.log(`Waiting ${Math.ceil(delayMs / 1000)}s before idle check.`);
            await sleep(delayMs);
          }

          function triggerDelayMs() {
            const run = readRun(repo, triggerRunId);
            const startedAt = Date.parse(run?.run_started_at || run?.created_at || '');
            if (!Number.isFinite(startedAt)) return Math.max(0, fallbackDelayMs);
            return Math.max(0, startedAt + targetIntervalMs - Date.now());
          }

          async function dispatchWhenIdle({ allowCooldownWait }) {
            const runs = readUpdateRuns(repo);
            const activeStatuses = new Set(['queued', 'in_progress', 'waiting', 'requested', 'pending']);
            const active = runs.find((run) => activeStatuses.has(run.status));
            if (active) {
              console.log(`Skip dispatch: update run #${active.run_number} is ${active.status}.`);
              return;
            }

            const now = Date.now();
            const recentOther = runs.find((run) => {
              if (String(run.id) === triggerRunId) return false;
              const activityAt = Date.parse(run.updated_at || run.run_started_at || run.created_at || '');
              return Number.isFinite(activityAt) && now - activityAt < 90 * 1000;
            });
            if (recentOther) {
              console.log(`Skip dispatch: another update run #${recentOther.run_number} changed recently at ${recentOther.updated_at}.`);
              return;
            }

            const status = readRankingStatus(repo);
            const failedAt = Date.parse(status?.attemptedAt || '');
            const cooldownMs = cooldownMinutes * 60 * 1000;
            const remainingMs = Number.isFinite(failedAt) ? cooldownMs - (now - failedAt) : 0;
            if (!isManualDispatch && status?.status === 'failed' && Number.isFinite(failedAt) && remainingMs > 0) {
              const remainingMinutes = Math.ceil(remainingMs / 60000);
              if (!allowCooldownWait) {
                console.log(`Skip dispatch: previous failure is still cooling down for ${remainingMinutes}m (${status.message || 'previous update failed'}).`);
                return;
              }

              const waitMs = remainingMs + cooldownBufferMs;
              console.log(
                `Previous failure is cooling down for ${remainingMinutes}m; rechecking after ${Math.ceil(waitMs / 1000)}s (${status.message || 'previous update failed'}).`,
              );
              await sleep(waitMs);
              await dispatchWhenIdle({ allowCooldownWait: false });
              return;
            }

            execFileSync('gh', ['workflow', 'run', 'youtube-ranking.yml', '--ref', 'main', '--repo', repo], {
              stdio: 'inherit',
            });
            console.log('Dispatched next YouTube ranking update.');
          }

          function readUpdateRuns(repo) {
            const raw = execFileSync(
              'gh',
              ['api', '--method', 'GET', `repos/${repo}/actions/workflows/youtube-ranking.yml/runs`, '-f', 'per_page=20'],
              { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] },
            );
            return JSON.parse(raw).workflow_runs || [];
          }

          function readRun(repo, runId) {
            try {
              const raw = execFileSync(
                'gh',
                ['api', '--method', 'GET', `repos/${repo}/actions/runs/${runId}`],
                { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] },
              );
              return JSON.parse(raw);
            } catch {
              return null;
            }
          }

          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, Math.max(0, ms)));
          }

          function readRankingStatus(repo) {
            try {
              const rawStatus = execFileSync(
                'gh',
                ['api', '--method', 'GET', `repos/${repo}/contents/data/youtube-ranking-status.json?ref=main`],
                { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] },
              );
              const payload = JSON.parse(rawStatus);
              const content = String(payload.content || '').replace(/\s+/g, '');
              return JSON.parse(Buffer.from(content, 'base64').toString('utf8'));
            } catch {
              return null;
            }
          }
          NODE
