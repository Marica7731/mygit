name: Dispatch YouTube ranking update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/youtube-ranking-scheduler.yml"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: Inspect recovery state without dispatching workflows
        type: boolean
        default: false
  workflow_run:
    workflows: ["Update YouTube ranking", "Chain YouTube ranking update", "Deploy YouTube ranking Pages"]
    branches: [main]
    types: [completed]
  repository_dispatch:
    types:
      - youtube-ranking-tick

permissions:
  actions: write
  contents: read
  deployments: read

jobs:
  dispatch:
    if: >-
      inputs.check_only != true &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.path == '.github/workflows/youtube-ranking-chain.yml' &&
        github.event.workflow_run.conclusion == 'failure'))
    concurrency:
      group: youtube-ranking-dispatch
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/reconcile-ranking.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Dispatch update when idle
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-ranking.js update

  recover:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.path == '.github/workflows/youtube-ranking.yml' &&
       github.event.workflow_run.conclusion != 'cancelled') ||
      (github.event.workflow_run.path == '.github/workflows/pages.yml' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.display_title != 'Recover YouTube ranking Pages')
    concurrency:
      group: youtube-ranking-recovery
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/reconcile-ranking.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Reconcile missing Pages deploy and update continuation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-ranking.js
