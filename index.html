<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Ranking Pages</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f4;
      color: #1f2933;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    main {
      width: min(720px, 100%);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.05;
    }
    p {
      margin: 0 0 16px;
      color: #52616b;
      font-size: 17px;
      line-height: 1.7;
    }
    code {
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(31, 41, 51, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        background: #111827;
        color: #f9fafb;
      }
      p {
        color: #cbd5e1;
      }
      code {
        background: rgba(249, 250, 251, 0.12);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>YouTube Ranking Pages</h1>
    <p>GitHub Pages and custom domain handoff are being prepared.</p>
    <p>Next implementation target: <code>歌枠</code> / <code>弾き語り</code> live, today, and month ranking pages.</p>
  </main>
</body>
</html>
